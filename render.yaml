databases:
  - name: reviews-ai-db
    databaseName: reviews_ai
    user: reviews_user
    plan: free
    region: frankfurt

services:
  # Go Backend (основной)
  - type: web
    name: reviews-ai-backend
    runtime: docker
    plan: starter
    region: frankfurt
    rootDir: backend-go
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: GIN_MODE
        value: release
      - key: DATABASE_URL
        fromDatabase:
          name: reviews-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 168h
      - key: CORS_ORIGIN
        value: "*"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: qwen/qwen3-coder:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_TEMPERATURE
        value: "0.3"
      - key: PARSER_SCROLL_DELAY_MS
        value: "2000"
      - key: PARSER_MAX_REVIEWS
        value: "200"
      - key: PARSER_TIMEOUT_SEC
        value: "60"
      - key: CHROME_BIN
        value: /usr/bin/chromium-browser
      - key: CHROMEDP_NO_SANDBOX
        value: "true"
