databases:
  - name: reviews-ai-db
    databaseName: reviews_ai
    user: reviews_user
    plan: free
    region: frankfurt

services:
  # Node.js Backend
  - type: web
    name: reviews-ai-backend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reviews-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: qwen/qwen3-coder:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
